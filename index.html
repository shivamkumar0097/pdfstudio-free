<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Free PDF tools that run inside your browser. Merge, split, rotate, compress, watermark, convert PDFs and more — your files never leave your device."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      ;(function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('pdfstudio-theme') === 'dark' ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <script>
      // No pinch / double-tap zoom on phones.
      ;(function () {
        var stop = function (e) {
          if (e.touches && e.touches.length > 1) e.preventDefault()
        }
        document.addEventListener('gesturestart', function (e) { e.preventDefault() })
        document.addEventListener('touchstart', stop, { passive: false })
        document.addEventListener('touchmove', stop, { passive: false })
        document.addEventListener('dblclick', function (e) { e.preventDefault() }, { passive: false })

        // Desktop: block Ctrl/Cmd + wheel and Ctrl/Cmd +/- zoom.
        document.addEventListener('wheel', function (e) {
          if (e.ctrlKey || e.metaKey) e.preventDefault()
        }, { passive: false })
        document.addEventListener('keydown', function (e) {
          if (!(e.ctrlKey || e.metaKey)) return
          if (['+', '=', '-', '_', '0'].indexOf(e.key) !== -1) e.preventDefault()
        })
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PDF Studio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PDF Studio — Free Browser PDF Tools" />
    <meta
      property="og:description"
      content="Merge, split, rotate, compress and convert PDFs privately in your browser. No uploads, no sign-up."
    />
    <meta property="og:image" content="https://pdfstudio-free.netlify.app/og/home.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>PDF Studio — Free Online PDF Tools That Never Upload Your Files</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
