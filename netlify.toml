[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Every tool has its own static HTML file, so search engines can read it.

[[redirects]]
from = "/merge"
to = "/merge/index.html"
status = 200

[[redirects]]
from = "/split"
to = "/split/index.html"
status = 200

[[redirects]]
from = "/organize"
to = "/organize/index.html"
status = 200

[[redirects]]
from = "/rotate"
to = "/rotate/index.html"
status = 200

[[redirects]]
from = "/reverse"
to = "/reverse/index.html"
status = 200

[[redirects]]
from = "/images-to-pdf"
to = "/images-to-pdf/index.html"
status = 200

[[redirects]]
from = "/pdf-to-images"
to = "/pdf-to-images/index.html"
status = 200

[[redirects]]
from = "/pdf-to-text"
to = "/pdf-to-text/index.html"
status = 200

[[redirects]]
from = "/watermark"
to = "/watermark/index.html"
status = 200

[[redirects]]
from = "/page-numbers"
to = "/page-numbers/index.html"
